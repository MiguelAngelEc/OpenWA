# OpenWA - Docker Compose for Development
# Quick Start: docker compose -f docker-compose.dev.yml up -d

services:
  # API Backend
  openwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    ports:
      - '127.0.0.1:2785:2785'
    environment:
      - NODE_ENV=development
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - SESSION_AUTO_RESTORE=${SESSION_AUTO_RESTORE:-true}
      # Inbound filtering (see README > Inbound Filtering & Memory)
      - IGNORE_STATUS=${IGNORE_STATUS:-true}
      - IGNORE_NEWSLETTERS=${IGNORE_NEWSLETTERS:-true}
      - IGNORE_BROADCASTS=${IGNORE_BROADCASTS:-true}
      - IGNORE_GROUPS=${IGNORE_GROUPS:-false}
      # Inbound media
      - DOWNLOAD_MEDIA=${DOWNLOAD_MEDIA:-true}
      - MEDIA_MAX_BYTES=${MEDIA_MAX_BYTES:-16777216}
      - MEDIA_ALLOWED_TYPES=${MEDIA_ALLOWED_TYPES:-}
      - MEDIA_UNKNOWN_SIZE_POLICY=${MEDIA_UNKNOWN_SIZE_POLICY:-skip}
      - MEDIA_DOWNLOAD_CONCURRENCY=${MEDIA_DOWNLOAD_CONCURRENCY:-1}
      - MEDIA_DOWNLOAD_QUEUE_MAX=${MEDIA_DOWNLOAD_QUEUE_MAX:-10}
      - MEDIA_DOWNLOAD_QUEUE_TIMEOUT_MS=${MEDIA_DOWNLOAD_QUEUE_TIMEOUT_MS:-30000}
      # Media delivery
      - MEDIA_DELIVERY_MODE=${MEDIA_DELIVERY_MODE:-inline}
      - MEDIA_STORAGE_TTL_SECONDS=${MEDIA_STORAGE_TTL_SECONDS:-86400}
      - MEDIA_STORAGE_FAILURE_POLICY=${MEDIA_STORAGE_FAILURE_POLICY:-skip}
      - MEDIA_STORAGE_CLEANUP_INTERVAL_SECONDS=${MEDIA_STORAGE_CLEANUP_INTERVAL_SECONDS:-3600}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_MAX_RETRIES=3
      - QUEUE_ENABLED=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard Frontend
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: openwa-dashboard
    ports:
      - '127.0.0.1:2886:80'
    depends_on:
      openwa:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: openwa-network
